# Inspired by https://github.com/jj-vcs/jj/issues/6612#issuecomment-2971953935

[aliases]
# Usage: jj addrelation --parent/-p <parent> --child/-c <child>
#
# Adds <parent> as a parent of <child>.
# jj rebase -s <child> -d <child>- -d <parent>
addrelation = ["util", "exec", "--", "bash", "-c", '''
    PARENT="" CHILD=""
    while [[ $# -gt 0 ]]; do
        case "$1" in
            -p|--parent) PARENT="$2"; shift 2;;
            -c|--child) CHILD="$2"; shift 2;;
            *) echo "Unknown argument: $1" >&2; exit 1;;
        esac
    done
    if [[ -z "$PARENT" || -z "$CHILD" ]]; then
        echo "Usage: jj addrelation --parent/-p REV --child/-c REV" >&2; exit 1
    fi
    jj rebase -s "$CHILD" -d "$CHILD-" -d "$PARENT"
''', "jj-addrelation"]

# Usage: jj rmrelation --parent/-p <parent> --child/-c <child>
#
# Removes <parent> as a parent of <child>.
# jj rebase -s <child> -d "all:<child>- ~ <parent>"
rmrelation = ["util", "exec", "--", "bash", "-c", '''
    PARENT="" CHILD=""
    while [[ $# -gt 0 ]]; do
        case "$1" in
            -p|--parent) PARENT="$2"; shift 2;;
            -c|--child) CHILD="$2"; shift 2;;
            *) echo "Unknown argument: $1" >&2; exit 1;;
        esac
    done
    if [[ -z "$PARENT" || -z "$CHILD" ]]; then
        echo "Usage: jj rmrelation --parent/-p REV --child/-c REV" >&2; exit 1
    fi
    jj rebase -s "$CHILD" -d "$CHILD- ~ $PARENT"
''', "jj-rmrelation"]

# Backcompat aliases
addparent = ["util", "exec", "--", "bash", "-c", "jj addrelation -c $1 -p $2", "jj-addparent"]
rmparent = ["util", "exec", "--", "bash", "-c", "jj rmrelation -c $1 -p $2", "jj-rmparent"]
addchild = ["util", "exec", "--", "bash", "-c", "jj addrelation -p $1 -c $2", "jj-addchild"]
rmchild = ["util", "exec", "--", "bash", "-c", "jj rmrelation -p $1 -c $2", "jj-rmchild"]
